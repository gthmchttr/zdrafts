# https://github.com/not-matthias/apollo: the theme most Zola sites on GitHub use
name = "apollo"
description = "Modern and minimalistic blog theme"
repo = "https://github.com/not-matthias/apollo"
commit = "31e30e27638aa68394d8625e5c49ad3b8310bf65"
license = "MIT"
demo = "https://not-matthias.github.io/apollo"
screenshot = "https://www.getzola.org/themes/apollo/screenshot.png"
zola = "0.23.6"

[components.image]
description = "Resized image"
icon = "file-media"
keywords = ["picture", "img"]
# Its path is required: one of the theme's own images
example = '{{ <image path="images/characters/hooded.png" alt="A hooded character" /> }}'
